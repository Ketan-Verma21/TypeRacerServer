# Nginx in front of the game servers (Phase 6): players use ONE address
# (localhost:8080) and Nginx spreads their connections over app1..app3.

worker_processes auto;
worker_rlimit_nofile 16384;

events {
    # Each player holds one WebSocket to Nginx and Nginx one to a game server,
    # so 1,000 players = ~2,000 connections.
    worker_connections 8192;
}

http {
    # Docker's internal DNS. Names are looked up again every few seconds, so
    # a game server that restarts (and gets a new IP) rejoins the rotation.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream typeracer_app {
        zone typeracer_app 64k; # shared memory, needed for `resolve`
        # least_conn: each new connection goes to the server with the fewest
        # open ones. Not sticky (ip_hash) on purpose: the game only speaks
        # WebSocket, so a connection never needs to come back to the same
        # server — and ip_hash would send a whole load test (one IP) to one server.
        least_conn;
        server app1:3000 resolve max_fails=3 fail_timeout=10s;
        server app2:3000 resolve max_fails=3 fail_timeout=10s;
        server app3:3000 resolve max_fails=3 fail_timeout=10s;
    }

    # WebSocket: pass the client's "Upgrade" request through to the game server.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # A stopped server's address doesn't answer at all, so the default 60 s
    # connect timeout would leave players hanging (the app gives up after 10 s)
    # and Nginx would never count enough failures to mark that server down.
    # Give up after 2 s and try the next server instead (load test, 2026-11-06).
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 3;

    # Edge rate limit for plain HTTP: 20 requests/s per IP (bursts of 40).
    limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;

    server {
        listen 80;

        location /socket.io/ {
            proxy_pass http://typeracer_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # A quiet socket still gets Socket.IO pings every 25 s; 120 s is plenty.
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /health {
            proxy_pass http://typeracer_app;
        }

        location / {
            limit_req zone=perip burst=40 nodelay;
            proxy_pass http://typeracer_app;
        }
    }
}
