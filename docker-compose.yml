# Local backend: Nginx -> three game servers -> Redis, plus Kafka for match events.
#   docker compose up --build -d   start everything; the game is on http://localhost:8080
#   docker compose stop app2       kill one server: its players reconnect to the others
#   docker compose down            remove containers (Redis data stays in the volume)
# Only Nginx is reachable from outside; the game servers sit behind it.

# Everything the game servers share. `<<: *app` copies it into each service.
x-app: &app
    build: .
    image: type-racer-server
    env_file: .env # copy .env.example to .env first
    depends_on:
        redis:
            condition: service_healthy
        kafka-init: # topics exist before the first event is sent
            condition: service_completed_successfully
    healthcheck:
        # The slim image has no curl, so ask Node to call /health/ready.
        test:
            [
                "CMD",
                "node",
                "-e",
                "fetch('http://localhost:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
            ]
        interval: 10s
        timeout: 3s
        retries: 3
        start_period: 5s
    restart: unless-stopped

x-app-env: &app-env
    STORE: redis
    REDIS_URL: redis://redis:6379 # "redis" = the service name below
    EVENTS: kafka
    KAFKA_BROKERS: kafka:9092

services:
    nginx:
        image: nginx:1.28-alpine
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        ports:
            - "8080:80" # the one address players use
        depends_on:
            app1:
                condition: service_healthy
            app2:
                condition: service_healthy
            app3:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost/health/live"]
            interval: 10s
            timeout: 3s
            retries: 3
        restart: unless-stopped

    app1:
        <<: *app
        environment:
            <<: *app-env
            INSTANCE_ID: app1

    app2:
        <<: *app
        environment:
            <<: *app-env
            INSTANCE_ID: app2

    app3:
        <<: *app
        environment:
            <<: *app-env
            INSTANCE_ID: app3

    redis:
        # Games, sessions, the race clock and the pub/sub between the servers.
        # AOF on, so data survives a Redis restart too.
        image: redis:7
        command: ["redis-server", "--appendonly", "yes"]
        ports:
            - "127.0.0.1:6379:6379" # host-only, for redis-cli and the real-Redis tests
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    kafka:
        # One Kafka broker in KRaft mode (no ZooKeeper): match.started and
        # match.finished go here, the stats worker reads them.
        # Containers use kafka:9092; tools on your machine use localhost:9094.
        # Data lives in the container: kept on stop/restart, gone after `down`.
        image: apache/kafka:4.1.0
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
            KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            # One broker, so every internal topic can only have one copy.
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # only kafka-init creates topics
            KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
        ports:
            - "127.0.0.1:9094:9094" # host-only, for the CLI tools and experiments
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1",
                ]
            interval: 10s
            timeout: 10s
            retries: 10
            start_period: 15s
        restart: unless-stopped

    kafka-init:
        # Creates the topics once, then exits. Safe to run again (--if-not-exists).
        # 2 partitions each, so two stats workers can share the work.
        image: apache/kafka:4.1.0
        depends_on:
            kafka:
                condition: service_healthy
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
                set -e
                for topic in match.started match.finished; do
                  /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
                    --create --if-not-exists --topic "$$topic" \
                    --partitions 2 --replication-factor 1
                done
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe
        restart: "no"

volumes:
    redis-data:
