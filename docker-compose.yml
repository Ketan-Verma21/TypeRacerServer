# Local backend (Phase 6): Nginx -> three game servers -> Redis.
#   docker compose up --build -d   start everything; the game is on http://localhost:8080
#   docker compose stop app2       kill one server: its players reconnect to the others
#   docker compose down            remove containers (Redis data stays in the volume)
# Only Nginx is reachable from outside; the game servers sit behind it.

# Everything the game servers share. `<<: *app` copies it into each service.
x-app: &app
    build: .
    image: type-racer-server
    env_file: .env # copy .env.example to .env first
    depends_on:
        redis:
            condition: service_healthy
    healthcheck:
        # The slim image has no curl, so ask Node to call /health/ready.
        test:
            [
                "CMD",
                "node",
                "-e",
                "fetch('http://localhost:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
            ]
        interval: 10s
        timeout: 3s
        retries: 3
        start_period: 5s
    restart: unless-stopped

x-app-env: &app-env
    STORE: redis
    REDIS_URL: redis://redis:6379 # "redis" = the service name below

services:
    nginx:
        image: nginx:1.28-alpine
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        ports:
            - "8080:80" # the one address players use
        depends_on:
            app1:
                condition: service_healthy
            app2:
                condition: service_healthy
            app3:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost/health/live"]
            interval: 10s
            timeout: 3s
            retries: 3
        restart: unless-stopped

    app1:
        <<: *app
        environment:
            <<: *app-env
            INSTANCE_ID: app1

    app2:
        <<: *app
        environment:
            <<: *app-env
            INSTANCE_ID: app2

    app3:
        <<: *app
        environment:
            <<: *app-env
            INSTANCE_ID: app3

    redis:
        # Games, sessions, the race clock and the pub/sub between the servers.
        # AOF on, so data survives a Redis restart too.
        image: redis:7
        command: ["redis-server", "--appendonly", "yes"]
        ports:
            - "127.0.0.1:6379:6379" # host-only, for redis-cli and the real-Redis tests
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
        restart: unless-stopped

volumes:
    redis-data:
